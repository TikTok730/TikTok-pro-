<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Pro - Enterprise Edition (Live Firebase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, increment, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgAn4OehtWHwVtCp9ISdJDWHaOZKK3GFk",
            authDomain: "tiktok-pro-46434.firebaseapp.com",
            projectId: "tiktok-pro-46434",
            storageBucket: "tiktok-pro-46434.firebasestorage.app",
            messagingSenderId: "634109089305",
            appId: "1:634109089305:web:85a8117ee997fd29a83c88",
            measurementId: "G-91T9CD8ERJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Expose Firebase tools globally for the app UI
        window.FB = { auth, db, googleProvider, signInWithPopup, signOut, onAuthStateChanged, collection, addDoc, getDocs, updateDoc, doc, increment, query, orderBy, onSnapshot };
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .snap-container { scroll-snap-type: y mandatory; height: calc(100vh - 130px); overflow-y: scroll; }
        .snap-item { scroll-snap-align: start; height: 100%; }
        @keyframes pulse-heart { 0% { transform: scale(0.8); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        .animate-heart { animation: pulse-heart 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-white font-sans transition-colors duration-300 flex flex-col h-screen overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="flex justify-between items-center px-4 py-3 border-b border-slate-200 dark:border-slate-800 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-black tracking-tighter bg-gradient-to-r from-rose-500 to-cyan-500 bg-clip-text text-transparent">TikTok</span>
            <span class="bg-gradient-to-r from-rose-500 to-cyan-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded tracking-widest uppercase">PRO LIVE</span>
        </div>
        <div class="flex items-center gap-4 text-sm font-semibold">
            <button onclick="switchFeed('following')" id="nav-following" class="text-slate-400 hover:text-slate-900 dark:hover:text-white transition">Following</button>
            <span class="text-slate-300 dark:text-slate-700">|</span>
            <button onclick="switchFeed('foryou')" id="nav-foryou" class="border-b-2 border-rose-500 pb-0.5">For You</button>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openLiveStudio()" class="bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white text-xs px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-broadcast-tower animate-pulse"></i><span>Go LIVE</span>
            </button>
            <button onclick="toggleDarkMode()" id="theme-toggle" class="text-lg p-1.5 text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"><i class="fa-solid fa-moon"></i></button>
            <div id="auth-container">
                <button onclick="loginWithGoogle()" class="bg-gradient-to-r from-rose-500 to-cyan-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow">Login</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden flex">
        <div id="video-feed" class="snap-container no-scrollbar w-full h-full flex flex-col items-center justify-center">
            <p class="text-xs text-slate-400 animate-pulse">Connecting to Firebase Realtime Cloud...</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="flex justify-around items-center py-2.5 border-t border-slate-200 dark:border-slate-800 z-50 text-xs font-semibold bg-white dark:bg-slate-950 text-slate-500 dark:text-slate-400">
        <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center text-rose-500"><i class="fa-solid fa-house text-xl mb-0.5"></i><span>Home</span></button>
        <button onclick="switchTab('discover')" id="tab-discover" class="flex flex-col items-center hover:text-slate-900 dark:hover:text-white"><i class="fa-solid fa-compass text-xl mb-0.5"></i><span>Discover</span></button>
        <button onclick="openUploadModal()" class="flex items-center justify-center bg-gradient-to-r from-rose-500 to-cyan-500 text-white w-12 h-8 rounded-xl text-lg font-bold shadow-lg shadow-rose-500/20 hover:scale-105 transition"><i class="fa-solid fa-plus text-sm"></i></button>
        <button onclick="switchTab('analytics')" id="tab-analytics" class="flex flex-col items-center hover:text-slate-900 dark:hover:text-white relative"><i class="fa-solid fa-chart-line text-xl mb-0.5"></i><span>Studio</span></button>
        <button onclick="switchTab('profile')" id="tab-profile" class="flex flex-col items-center hover:text-slate-900 dark:hover:text-white"><i class="fa-regular fa-user text-xl mb-0.5"></i><span>Profile</span></button>
    </nav>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-lg rounded-3xl p-6 relative shadow-2xl">
            <button onclick="closeUploadModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-2xl font-black mb-1">Upload to Firebase Cloud</h3>
            <p class="text-xs text-slate-500 mb-6">Firestore & Cloud Storage Synchronized</p>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1 block">Video Direct URL (MP4/HLS)</label>
                    <input type="text" id="upload-url-input" placeholder="https://assets.mixkit.co/videos/preview/..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-rose-500 transition">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1 block">Caption & Hashtags</label>
                    <textarea id="upload-caption-input" placeholder="Awesome moment! #fyp #viral" rows="2" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-rose-500 transition resize-none"></textarea>
                </div>
                <button onclick="handleVideoUpload()" class="w-full bg-gradient-to-r from-rose-500 to-cyan-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-rose-500/20 hover:opacity-90 transition text-sm">Publish Post</button>
            </div>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        let currentUser = null;
        let videosCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const { auth, onAuthStateChanged, db, collection, query, orderBy, onSnapshot } = window.FB;
                
                // Auth State Listener
                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    const authContainer = document.getElementById('auth-container');
                    if (user) {
                        authContainer.innerHTML = `<div class="flex items-center gap-2"><img src="${user.photoURL || 'https://via.placeholder.com/30'}" class="w-7 h-7 rounded-full border border-rose-500"><button onclick="logout()" class="text-xs font-bold text-rose-500">Logout</button></div>`;
                    } else {
                        authContainer.innerHTML = `<button onclick="loginWithGoogle()" class="bg-gradient-to-r from-rose-500 to-cyan-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow">Login</button>`;
                    }
                });

                // Realtime Firestore Feed Sync
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    videosCache = [];
                    snapshot.forEach((docSnap) => {
                        videosCache.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    if(videosCache.length === 0) {
                        // Seed default video if empty
                        seedDefaultVideos();
                    } else {
                        renderFeed();
                    }
                });
            }, 1000);
        });

        async function seedDefaultVideos() {
            const { db, collection, addDoc } = window.FB;
            const defaultV = {
                creatorName: 'Elena Vance', creatorHandle: '@elena', creatorAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150',
                videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4',
                caption: 'Beautiful ocean waves synced via Firebase! 🌊✨ #nature', likes: 1420, comments: 42, shares: 120, createdAt: Date.now()
            };
            await addDoc(collection(db, "videos"), defaultV);
        }

        function loginWithGoogle() {
            const { auth, googleProvider, signInWithPopup } = window.FB;
            signInWithPopup(auth, googleProvider).catch(err => alert(err.message));
        }

        function logout() {
            const { auth, signOut } = window.FB;
            signOut(auth);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
        }

        function switchFeed(tab) {
            renderFeed();
        }

        function switchTab(tabId) {
            const feed = document.getElementById('video-feed');
            if (tabId === 'home') renderFeed();
            else if (tabId === 'analytics') {
                feed.innerHTML = `<div class="p-6 max-w-xl mx-auto w-full text-center"><h2 class="text-2xl font-black mb-4">Creator Studio</h2><div class="p-6 bg-slate-100 dark:bg-slate-900 rounded-3xl border"><span class="text-xs text-slate-400">Firebase Firestore Cloud Balance</span><h3 class="text-3xl font-black text-emerald-500 mt-2">$2,450.00</h3></div></div>`;
            } else if (tabId === 'profile') {
                feed.innerHTML = `<div class="p-6 max-w-md mx-auto text-center"><img src="${currentUser ? currentUser.photoURL : 'https://via.placeholder.com/100'}" class="w-24 h-24 rounded-full mx-auto mb-4 border-2 border-rose-500"><h3 class="text-xl font-black">${currentUser ? currentUser.displayName : 'Guest User'}</h3><p class="text-xs text-slate-400">${currentUser ? currentUser.email : 'Please login with Google'}</p></div>`;
            } else {
                feed.innerHTML = `<div class="p-6 text-center"><h3 class="text-xl font-black">Discover Hub Active</h3></div>`;
            }
        }

        function renderFeed() {
            const feedContainer = document.getElementById('video-feed');
            feedContainer.innerHTML = '';
            if(videosCache.length === 0) {
                feedContainer.innerHTML = `<p class="text-xs text-slate-400">Loading Cloud Feed...</p>`;
                return;
            }
            videosCache.forEach(video => {
                const item = document.createElement('div');
                item.className = 'snap-item relative w-full h-full flex items-center justify-center bg-black';
                item.innerHTML = `
                    <video class="w-full h-full object-cover cursor-pointer" loop playsinline src="${video.videoUrl}"></video>
                    <div class="absolute right-3 bottom-20 flex flex-col items-center gap-5 z-20">
                        <div class="w-12 h-12 rounded-full border-2 border-white overflow-hidden shadow-lg"><img src="${video.creatorAvatar || 'https://via.placeholder.com/50'}" class="w-full h-full object-cover"></div>
                        <button onclick="likeVideo('${video.id}')" class="flex flex-col items-center text-white drop-shadow-md"><i class="fa-solid fa-heart text-3xl text-rose-500"></i><span class="text-xs font-black mt-1">${video.likes}</span></button>
                        <button onclick="alert('Cloud Comments Drawer')" class="flex flex-col items-center text-white drop-shadow-md"><i class="fa-solid fa-comment-dots text-3xl"></i><span class="text-xs font-black mt-1">${video.comments}</span></button>
                        <button onclick="alert('Shared via Firebase Link!')" class="flex flex-col items-center text-white drop-shadow-md"><i class="fa-solid fa-share text-3xl"></i><span class="text-xs font-black mt-1">${video.shares}</span></button>
                    </div>
                    <div class="absolute left-4 bottom-16 right-20 z-20 text-white drop-shadow-md">
                        <h4 class="font-black text-base mb-1">${video.creatorHandle || '@creator'}</h4>
                        <p class="text-xs text-slate-200 line-clamp-2 font-medium mb-3">${video.caption}</p>
                    </div>
                `;
                const vidEl = item.querySelector('video');
                vidEl.addEventListener('click', () => vidEl.paused ? vidEl.play() : vidEl.pause());
                feedContainer.appendChild(item);
            });
            setupObserver();
        }

        async function likeVideo(id) {
            const { db, doc, updateDoc, increment } = window.FB;
            const videoRef = doc(db, "videos", id);
            await updateDoc(videoRef, { likes: increment(1) });
        }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) entry.isIntersecting ? video.play().catch(() => {}) : video.pause();
                });
            }, { threshold: 0.6 });
            document.querySelectorAll('.snap-item').forEach(item => observer.observe(item));
        }

        function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }
        function openLiveStudio() { alert('Live WebRTC Stream Studio Initialized.'); }

        async function handleVideoUpload() {
            if(!currentUser) { alert('Please login with Google first!'); return; }
            const { db, collection, addDoc } = window.FB;
            const url = document.getElementById('upload-url-input').value.trim();
            const caption = document.getElementById('upload-caption-input').value.trim();
            
            if(!url) { alert('Please enter a video URL'); return; }

            await addDoc(collection(db, "videos"), {
                creatorName: currentUser.displayName,
                creatorHandle: '@' + currentUser.email.split('@')[0],
                creatorAvatar: currentUser.photoURL,
                videoUrl: url,
                caption: caption || 'New viral post #fyp',
                likes: 0, comments: 0, shares: 0,
                createdAt: Date.now()
            });

            closeUploadModal();
            alert('Successfully published to Firebase Firestore Cloud!');
        }
    </script>
</body>
                      </html>
